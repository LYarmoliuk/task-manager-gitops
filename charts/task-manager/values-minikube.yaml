# Значення для середовища minikube (GitOps).
# Secret створюється вручну (kubectl create secret) і в Git не зберігається.
existingSecret: task-manager-secret

backend:
  replicas: 3
  image:
    repository: ghcr.io/lyarmoliuk/devops_task_manager-backend
    tag: "1.2.0"

frontend:
  replicas: 1
  image:
    repository: ghcr.io/lyarmoliuk/devops_task_manager-frontend
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePort: 30085

persistence:
  enabled: true
  existingClaim: ""

config:
  appVersion: "1.2.0"

# --- Argo Rollouts (ЛР-6)
rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}               # чекати ручного promote
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
